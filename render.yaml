services:
  - type: web
    name: drill-tracker
    runtime: python
    buildCommand: "pip install -r requirements.txt && git log -1 --format=%cI > build_info.txt"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
